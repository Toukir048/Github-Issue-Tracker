<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Tracker | Login </title>
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">

    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />

    <!-- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        * {
            font-family: "Geist", sans-serif;
        }
    </style>
</head>

<body class="bg-[#F8FAFC]">
    <!-- navbar -->

    <div class="navbar bg-base-200 shadow-sm justify-between items-center px-2 md:px-8">
        <div class="flex flex-row  gap-2 w-full">
            <img class="w-[35px]" src="./assets/github-logo.png" alt="">
            <h2 class="text-[14px] text-[rgb(31,41,55)] text-wrap md:text-[24px] font-semibold">GitHub <br
                    class="md:hidden"> Issues Tracker</h2>
        </div>

        <div class="flex gap-2">
            <input type="text" placeholder="Search issues..." class="input
            input-bordered w-24 md:w-auto" />
            <button class="btn btn-primary"><i class="fa-solid fa-magnifying-glass-plus"></i>Search</button>
        </div>
    </div>

    <!-- tabs -->
    <div role="tablist" class="tabs shadow mt-10 w-[90%] md:w-[80%] mx-auto p-5 bg-slate-50 gap-3 rounded">
        <a id="all-tab" role="tab "
            class="tab border border-gray-300 w-[160px] tab-active hover:text-neutral-800 hover:bg-blue-500 bg-blue-800 text-white rounded ">All</a>
        <a id="open-tab" role="tab" class="tab  border border-gray-300  w-[160px]  rounded">Open</a>
        <a id="close-tab" role="tab" class="tab  border border-gray-300 w-[160px] rounded">Close</a>
    </div>

    <!-- issues -->
    <section
        class="abs shadow mt-10 w-[90%] md:w-[80%] mx-auto p-5 bg-slate-50 gap-3 rounded-t border-b-2 border-black/30">
        <div class="flex flex-row items-center gap-2 ">
            <div class=" w-[50px] flex justify-center items-center">
                <img src="./assets/Aperture.png" alt="">
            </div>

            <div class="gap-1">
                <h1 class="text-[20px] font-semibold text-neutral-800"><span>50</span> Issues</h1>
                <p class="text-neutral-600/80 text-[16px]">Track and manage your project issues</p>
            </div>
        </div>
    </section>

</body>

</html>

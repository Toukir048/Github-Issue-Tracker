    <title>G.I.T | Home </title>

    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />

        * {

<body >
    <!-- navbar -->

    <div class="navbar bg-base-200 shadow-sm justify-between items-center px-2 md:px-8">
        <div class="flex flex-row  gap-2 w-full">
            <img class="w-[35px]" src="./assets/github-logo.png" alt="">
            <h2 class="text-[14px] text-[rgb(31,41,55)] text-wrap md:text-[24px] font-semibold">GitHub <br
                    class="md:hidden"> Issues Tracker</h2>
        </div>

        <div class="flex gap-2">
            <input id="search-input" type="text" placeholder="Search issues..." class="input
            input-bordered w-24 md:w-auto" />
            <button id="search-btn" onclick="search()" class="btn btn-primary"><i class="fa-solid fa-magnifying-glass-plus"></i>Search</button>
        </div>
    </div>

    <!-- tabs -->
    <div role="tablist" class="tabs shadow mt-10 w-[90%] md:w-[80%] mx-auto p-5 bg-slate-50 gap-3 rounded">
        <a id="all-tab" role="tab "
            class="tab tab-btn border border-gray-300 w-[160px]  bg-blue-800 text-white rounded " onclick="getIssues()">All</a>
        <a id="open-tab" role="tab " class="tab tab-btn  border border-gray-300  w-[160px]  rounded">Open</a>
        <a id="close-tab" role="tab" class="tab  tab-btn border border-gray-300 w-[160px] rounded">Close</a>
    </div>

    <!-- issues summary -->
    <section
        class="abs shadow mt-10 w-[90%] md:w-[80%] mx-auto p-5 bg-slate-50 gap-3 rounded-t border-b-2 border-black/30 flex justify-between items-center">
        <div class="flex flex-row items-center gap-2 ">
            <div class=" w-[50px] flex justify-center items-center">
                <img src="./assets/Aperture.png" alt="">
            </div>

            <div class="gap-1">
                <h1 class="text-[18px] md:text-xl font-semibold text-neutral-800"><span id="tab-count">50</span> Issues
                </h1>
                <p class="text-neutral-600/80 text-[10px] md:text-[16px]">Track and manage your project issues</p>
            </div>
        </div>

        <div class="text-[12px] text-neutral-600 font-normal flex flex-row gap-5 px-5">
            <p><i class="fa-solid fa-circle text-green-700"></i> Open </p>
            <p><i class="fa-solid fa-circle text-purple-800"></i> Closed</p>
        </div>
    </section>

    <!-- Loading Spinner -->
    <span id="loader" class="loading loading-spinner loading-xl absolute top-[70%] left-[48%] animate-pulse"></span>


    <!-- issues Card Section -->
    <section id="cards" class="w-[90%] md:w-[80%] mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 bg-gray-50 rounded-b border-gray-500 ">
